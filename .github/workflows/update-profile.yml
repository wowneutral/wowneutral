name: Update profile

on:
  workflow_dispatch:
  schedule:
    # Four times per hour, offset from :00 to reduce schedule congestion.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh dynamic profile blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit changes if anything changed
        run: |
          if git diff --quiet README.md; then
            echo "No profile changes."
            exit 0
          fi

          git config user.name "wowneutral-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile"
          git push
