name: Update profile

on:
  workflow_dispatch:
  push:
    paths: [scripts/**, .github/workflows/update-profile.yml]
  schedule:
    # Hourly, off the top of the hour to dodge schedule congestion.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency: profile-push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the card and live README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit if anything changed
        run: |
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "wowneutral-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: refresh profile"
          git pull --rebase --quiet
          git push --quiet
