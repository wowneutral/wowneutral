<svg xmlns="http://www.w3.org/2000/svg" width="412" height="200" viewBox="0 0 412 200" role="img" aria-label="Contributions by day of week"><style>
  .frame { fill: #0d1117; stroke: #30363d; }
  .lbl { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .08em; fill: #9198a1; }
