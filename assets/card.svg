<svg xmlns="http://www.w3.org/2000/svg" width="840" height="406" viewBox="0 0 840 406" role="img" aria-label="Live GitHub stats for wowneutral, formatted as a debate evidence card">
<style>
  .sheet { font-family: Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif; color: #000; }
  .tag { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0 0 8px; }
  .cite { margin: 0 0 12px; line-height: 1.35; }
  .cite b { font-size: 24px; margin-right: 1px; }
  .cite small { font-size: 12px; }
  .body { font-size: 11px; line-height: 1.75; margin: 0; }
  .body u, .body mark { font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; color: #000; }
  .body u { font-size: 14.5px; }
  .body mark {
    font-size: 19px;
    background: linear-gradient(#73f7f8, #73f7f8) no-repeat 0 0 / 100% 100%;
    animation: hl .5s ease-out backwards;
  }
  .body mark:nth-of-type(2) { animation-delay: .12s }
  .body mark:nth-of-type(3) { animation-delay: .24s }
  .body mark:nth-of-type(4) { animation-delay: .36s }
  .body mark:nth-of-type(5) { animation-delay: .48s }
  .body mark:nth-of-type(6) { animation-delay: .6s }
  .body mark:nth-of-type(7) { animation-delay: .72s }
  .body mark:nth-of-type(8) { animation-delay: .84s }
  .body mark:nth-of-type(n+9) { animation-delay: .96s }
  @keyframes hl { from { background-size: 0% 100%; } }
  @media (prefers-reduced-motion: reduce) { .body mark { animation: none; } }
  .fig { font: 11px Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif; fill: #666; }
</style>
<rect x="0.5" y="0.5" width="839" height="405" rx="2" fill="#ffffff" stroke="#d0d7de"/>
<foreignObject x="36" y="30" width="768" height="336">
  <div xmlns="http://www.w3.org/1999/xhtml" class="sheet">
    <p class="tag">Armaan ships---the record is live, and it rewrites itself every hour.</p>
    <p class="cite"><b>Seth '26</b><small>[Armaan Seth, debater and coach, Skeptical LD and MITEZ. “Public record for @wowneutral,” GitHub REST and GraphQL APIs, https://github.com/wowneutral, pulled Nov 28, 2026, 2:46 AM EST, DOA: 11/28/26] //skeplover&#10084;</small></p>
    <p class="body"><span>Pulled from GitHub&#x27;s public API on the hour; forks and archived repositories are excluded from every count below. </span><u>As of this pull, the account holds </u><mark>7 public repositories</mark><u> carrying </u><mark>5 stars</mark><u> and </u><mark>2 followers.</mark><span> Contribution totals include commits, pull requests, issues and reviews to public repositories. </span><u>Over the last year it </u><mark>logged 246 contributions</mark><u> across </u><mark>14 separate days,</mark><u> with a current streak of </u><mark>1 day</mark><u> against a best of 3.</u><span> Days are counted in UTC, the way GitHub counts them. </span><u>The most recent push went to </u><mark>puffer-party</mark><u> yesterday.</u><span> By volume of code, the stack runs </span><mark>TypeScript 58%</mark><u>, </u><mark>CSS 23%</mark><u>, </u><mark>HTML 15%</mark><u>, and </u><mark>JavaScript 3%</mark><u>.</u><span> That mix is mostly websites, which is the point: </span><u>nearly all of it </u><mark>ships to the debate community</mark><u>, to people who cut cards, flow rounds, and need tools that </u><mark>work on a Chromebook.</mark></p>
  </div>
</foreignObject>
<text class="fig" x="36" y="388">Card re-cut automatically from live data</text>
<text class="fig" x="804" y="388" text-anchor="end">updated Nov 28, 2026, 2:46 AM EST</text>
</svg>
